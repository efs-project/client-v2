packages:
  - apps/web
  - tools

# Supply-chain policy (pnpm 11+ settings live here, not in .npmrc).
# No dependency may run install scripts unless listed here with a reviewed reason.
allowBuilds: {}
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440

# Exactly one TC39 Signals implementation per realm. @lit-labs/signals and our own
# state adapter must share it, or Lit's watchers and ours see different graphs.
overrides:
  signal-polyfill: 0.2.3
